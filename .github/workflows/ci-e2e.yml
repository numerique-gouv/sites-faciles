name: 🎭 CI - E2E tests

on:
  push:
    branches: [main]
  # labeled/unlabeled so adding or removing `visual-change` re-runs the checks.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  # Generate the trusted visual baseline from the target branch (main). The
  # reusable workflow overlays *this* branch's e2e/ + playwright config onto the
  # main checkout, so both jobs run identical @regression test definitions —
  # only the application code differs. Only @regression tests run here (see
  # _e2e.yml); other functional tests are skipped since main may not yet have
  # the app changes they assert on. The screenshots produced here are
  # uploaded as the `regression-screenshots` artifact.
  baseline:
    name: Baseline (main)
    uses: ./.github/workflows/_e2e.yml
    with:
      ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      compare: false
    permissions:
      contents: read

  # Render the full suite against the PR branch: functional tests assert
  # behavior for real, and each @regression test also compares its screenshot
  # against the baseline. Any test failure or visual diff fails this job, except
  # visual diffs on a PR labelled `visual-change` (intended visual changes),
  # which are reported as a warning with the diff images uploaded.
  compare:
    name: Compare (current branch)
    needs: baseline
    uses: ./.github/workflows/_e2e.yml
    with:
      ref: ${{ github.ref }}
      compare: true
      allow_visual_diff: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
    permissions:
      contents: read

permissions:
  contents: read
