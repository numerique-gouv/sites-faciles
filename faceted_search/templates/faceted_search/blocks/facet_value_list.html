{% load faceted_search_tags %}

<ul class="fr-facet-list">
  {% for item in items %}
    {% facet_value item facet as item_value %}
    <li>
      <div class="fr-checkbox-group fr-checkbox-group--sm">
        <input type="checkbox"
               form="faceted-search-form"
               onchange="this.form.submit()"
               id="facet-{{ facet }}-{{ item_value }}"
               name="{{ facet }}"
               value="{{ item_value }}"
               {% if item in selected_values %}checked{% endif %} />
        <label class="fr-label" for="facet-{{ facet }}-{{ item_value }}">{% facet_label item.name item.result_count %}</label>
      </div>
    </li>
  {% endfor %}
</ul>
